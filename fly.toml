# Fly.io deployment. Replace your-app-name (twice) with your own app name, then see
# "Remote access" in README.md for the volume and secrets.
app = "your-app-name"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  FINDER_AUTH = "all"                       # always ask for FINDER_PASSWORD (set as a secret)
  FINDER_ALLOWED_HOSTS = "your-app-name.fly.dev"   # add your own domain, comma-separated
  FINDER_ENV_FILE = "/app/data/.env"        # settings saved in the app survive restarts
  FORWARDED_ALLOW_IPS = "*"                 # trust Fly's proxy for https and client IPs

[mounts]
  source = "finder_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"               # sleeps when nobody uses it
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
