# Fly.io deployment of the app. It gets only a private address (Flycast); the login gate
# in fly.gate.toml is the public part. Replace your-app-name (twice), then see
# "Remote access" in README.md.
app = "your-app-name"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  FINDER_AUTH = "all"                       # always ask for FINDER_PASSWORD (set as a secret)
  FINDER_ALLOWED_HOSTS = "your-app-name-gate.fly.dev"   # the gate's host names, comma-separated
  FINDER_ENV_FILE = "/app/data/.env"        # settings saved in the app survive restarts
  FORWARDED_ALLOW_IPS = "*"                 # trust Fly's proxy for https and client IPs

[mounts]
  source = "finder_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = false                       # private: the gate handles https
  auto_stop_machines = "stop"               # sleeps when nobody uses it; only the gate can wake it
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "performance-2x"           # 2 dedicated cores: shared CPUs are throttled and the image model needs a full core
  memory = "4gb"
