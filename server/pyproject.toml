[project]
name = "openclothingsearch"
version = "0.1.0"
description = "Find an item across Taobao, 1688, Weidian and Yupoo by image similarity"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx[http2]>=0.28",
    "patchright>=1.52",
    "selectolax>=0.3",
    "pillow>=11",
    "numpy>=2",
    "torch>=2.6",
    "open-clip-torch>=2.32",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.2",
    "pillow-heif>=1.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finder"]

[project.scripts]
finder = "finder.app:main"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Errors that point at real bugs; style is left to the author.
select = ["F", "E9", "B", "ASYNC", "RUF006"]
ignore = ["B008", "B905", "ASYNC109"]
